global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: mall-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mall-gateway:8201"]
  - job_name: mall-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mall-admin:8080"]
  - job_name: mall-portal
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mall-portal:8085"]
  - job_name: mall-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mall-auth:8401"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
